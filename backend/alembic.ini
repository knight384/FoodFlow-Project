[alembic]
script_location = migrations
prepend_sys_path = .

# Timezone-naive by default; timestamps use UTC throughout the app
# (Database Specification v1.0 Section 6 conventions).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left unset here — migrations/env.py reads
# DATABASE_URL from the application's environment configuration (app.config)
# instead, consistent with TRD v1.0 Section 21 (no secrets/connection
# strings committed to source control).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
